name: Verify Poklike
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
concurrency:
  group: poklike-browser-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  unit-and-offline-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run unit tests
        run: npm test
      - name: Install browser for deterministic CI
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
          install-dependencies: true
      - name: Select installed Chrome
        run: echo "CHROMIUM=${{ steps.chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"
      - name: Run offline Chromium browser tests
        run: timeout --signal=TERM 150s npm run test:browser
      - name: Verify offline browser at GitHub Pages subpath
        env:
          POKLIKE_BASE_PATH: /poklike/
        run: timeout --signal=TERM 150s npm run test:browser
      - name: Save screenshots and test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poklike-browser-captures
          path: test-artifacts/
          if-no-files-found: ignore
