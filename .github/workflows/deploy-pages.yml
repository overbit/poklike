name: Deploy Poklike to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5
      - name: Package static offline app
        run: |
          mkdir -p _site/icons
          cp index.html styles.css app.js toys.js profile.js portrait-toys.js wide-toys.js sw.js manifest.webmanifest _site/
          cp icons/poklike.svg icons/poklike-180.png icons/poklike-192.png icons/poklike-512.png _site/icons/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published HTTPS assets
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          site="${SITE_URL%/}"
          test -n "$site"
          for path in index.html styles.css app.js toys.js profile.js portrait-toys.js wide-toys.js sw.js manifest.webmanifest icons/poklike.svg icons/poklike-180.png icons/poklike-192.png icons/poklike-512.png; do
            echo "Checking public asset: $path"
            response="$(mktemp)"
            matched=0
            for attempt in 1 2 3 4 5; do
              if curl -fLsS --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 25 \
                -H 'Cache-Control: no-cache' -o "$response" "$site/$path" && cmp -s "$path" "$response"; then
                matched=1
                break
              fi
              sleep 4
            done
            rm -f "$response"
            if [ "$matched" -ne 1 ]; then
              echo "::error::Public asset unavailable or differs from the checked-out commit: $path"
              exit 1
            fi
          done
          echo "All published assets match the repository commit."
