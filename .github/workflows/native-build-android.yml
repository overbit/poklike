name: Build offline Android preview APK
on:
  push:
    branches: [main, 'feat/**']
    paths:
      - 'native/**'
      - 'toys.js'
      - '.github/workflows/native-build-android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK platform
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Install native dependencies
        run: npm install --prefix native --no-audit --no-fund
      - name: Generate native Android project
        working-directory: native
        env:
          EXPO_NO_TELEMETRY: '1'
          CI: '1'
        run: npx expo prebuild --platform android --no-install
      - name: Build standalone offline Android APK
        working-directory: native/android
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
          NODE_ENV: production
        run: ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Check APK output
        run: test -s native/android/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: poklike-android-preview-apk
          path: native/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
